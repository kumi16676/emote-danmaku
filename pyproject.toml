[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emote-danmaku"
version = "1.0.0"
description = "Render bilibili live emote danmaku ([妙啊]) as real pictures in the ASS produced by DanmakuFactory"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["pillow>=9.0"]

[project.scripts]
emote-danmaku = "emote_danmaku.cli:main"

[tool.setuptools]
packages = ["emote_danmaku"]
